<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Operations</title>
  <style>
    body {
      background-color: red;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    pre {
      background: #440000;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Matrix Operations in JavaScript</h1>
  <p>Performing addition and multiplication on 2x2 matrices.</p>
  <pre id="output"></pre>

  <script>
    // Define 2x2 matrices
    const mat1 = [
      [1, 2],
      [4, 5]
    ];

    const mat2 = [
      [3, 4],
      [6, 7]
    ];

    const mat3 = [
      [2, 0],
      [1, 1]
    ];

    // Matrix addition
    const sumMat = [
      [mat1[0][0] + mat2[0][0], mat1[0][1] + mat2[0][1]],
      [mat1[1][0] + mat2[1][0], mat1[1][1] + mat2[1][1]]
    ];

    // Matrix multiplication: sumMat * mat3
    const result = [
      [
        sumMat[0][0] * mat3[0][0] + sumMat[0][1] * mat3[1][0],
        sumMat[0][0] * mat3[0][1] + sumMat[0][1] * mat3[1][1]
      ],
      [
        sumMat[1][0] * mat3[0][0] + sumMat[1][1] * mat3[1][0],
        sumMat[1][0] * mat3[0][1] + sumMat[1][1] * mat3[1][1]
      ]
    ];

    // Display result
    const output = document.getElementById("output");
    output.textContent = `Matrix 1:\n${JSON.stringify(mat1)}\n\n` +
                         `Matrix 2:\n${JSON.stringify(mat2)}\n\n` +
                         `Sum (mat1 + mat2):\n${JSON.stringify(sumMat)}\n\n` +
                         `Matrix 3:\n${JSON.stringify(mat3)}\n\n` +
                         `Final Result (Sum * mat3):\n${JSON.stringify(result)}`;
  </script>
</body>
</html>
