<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Matrix Calculator</title>
  <style>
    body {
      background-color: red;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .matrix {
      margin-bottom: 20px;
    }
    .matrix label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .matrix input {
      width: 40px;
      text-align: center;
      margin: 2px;
    }
    #calculate {
      margin-top: 10px;
      padding: 8px 16px;
      background: #880000;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    pre {
      background: #440000;
      padding: 10px;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>2x2 Matrix Calculator</h1>

  <div class="matrix" id="mat1">
    <label>Matrix 1</label>
    <input type="number" id="m1_00"> <input type="number" id="m1_01"><br>
    <input type="number" id="m1_10"> <input type="number" id="m1_11">
  </div>

  <div class="matrix" id="mat2">
    <label>Matrix 2</label>
    <input type="number" id="m2_00"> <input type="number" id="m2_01"><br>
    <input type="number" id="m2_10"> <input type="number" id="m2_11">
  </div>

  <div class="matrix" id="mat3">
    <label>Matrix 3</label>
    <input type="number" id="m3_00"> <input type="number" id="m3_01"><br>
    <input type="number" id="m3_10"> <input type="number" id="m3_11">
  </div>

  <button id="calculate">Calculate</button>

  <pre id="output"></pre>

  <script>
    document.getElementById("calculate").addEventListener("click", () => {
      // Collect values from inputs and convert to integers
      const mat1 = [
        [parseInt(document.getElementById("m1_00").value), parseInt(document.getElementById("m1_01").value)],
        [parseInt(document.getElementById("m1_10").value), parseInt(document.getElementById("m1_11").value)]
      ];

      const mat2 = [
        [parseInt(document.getElementById("m2_00").value), parseInt(document.getElementById("m2_01").value)],
        [parseInt(document.getElementById("m2_10").value), parseInt(document.getElementById("m2_11").value)]
      ];

      const mat3 = [
        [parseInt(document.getElementById("m3_00").value), parseInt(document.getElementById("m3_01").value)],
        [parseInt(document.getElementById("m3_10").value), parseInt(document.getElementById("m3_11").value)]
      ];

      // Matrix addition: mat1 + mat2
      const sumMat = [
        [mat1[0][0] + mat2[0][0], mat1[0][1] + mat2[0][1]],
        [mat1[1][0] + mat2[1][0], mat1[1][1] + mat2[1][1]]
      ];

      // Matrix multiplication: sumMat * mat3
      const result = [
        [
          sumMat[0][0] * mat3[0][0] + sumMat[0][1] * mat3[1][0],
          sumMat[0][0] * mat3[0][1] + sumMat[0][1] * mat3[1][1]
        ],
        [
          sumMat[1][0] * mat3[0][0] + sumMat[1][1] * mat3[1][0],
          sumMat[1][0] * mat3[0][1] + sumMat[1][1] * mat3[1][1]
        ]
      ];

      // Display matrices and results
      const output = document.getElementById("output");
      output.textContent =
        `Matrix 1: ${JSON.stringify(mat1)}\n` +
        `Matrix 2: ${JSON.stringify(mat2)}\n` +
        `Sum (mat1 + mat2): ${JSON.stringify(sumMat)}\n` +
        `Matrix 3: ${JSON.stringify(mat3)}\n` +
        `Final Result (Sum * mat3): ${JSON.stringify(result)}`;
    });
  </script>
</body>
</html>
